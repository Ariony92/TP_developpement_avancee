spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  sql:
    init:
      mode: never

server:
  port: 8080

app:
  jwt:
    secret: Y0VyWXNlY3JldEtleUZvckpXVFNpZ25pbmdUaGlzSXNMb25nRW5vdWdoMTIz
    expiration-ms: 3600000

logging:
  level:
    root: WARN
    tp_avancee_dev.tp_avancee: WARN
