version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: masterannonce-db
    environment:
      POSTGRES_DB: MasterAnnonce
      POSTGRES_USER: tpavancee
      POSTGRES_PASSWORD: tpavancee
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tpavancee -d MasterAnnonce"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: masterannonce-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/MasterAnnonce
      SPRING_DATASOURCE_USERNAME: tpavancee
      SPRING_DATASOURCE_PASSWORD: tpavancee
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
