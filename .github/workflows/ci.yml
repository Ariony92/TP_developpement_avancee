name: CI - MasterAnnonce

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]

    steps:
      # Étape A — Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # Étape B — Setup Java + cache Maven
      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Étape C — Build & tests (Testcontainers démarre PostgreSQL automatiquement)
      - name: Build & verify
        run: mvn -B clean verify

      # Étape D — Upload JAR artifact
      - name: Upload JAR artifact
        if: matrix.java == 17
        uses: actions/upload-artifact@v4
        with:
          name: master-annonce-jar
          path: target/tp_avancee.jar

      # Bonus 3 — Upload JaCoCo coverage report
      - name: Upload JaCoCo report
        if: matrix.java == 17
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t masterannonce:latest .

      - name: Save Docker image as artifact
        run: docker save masterannonce:latest | gzip > masterannonce-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: masterannonce-docker-image
          path: masterannonce-image.tar.gz
